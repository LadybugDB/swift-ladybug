name: Update Ladybug
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Ladybug tag (e.g. v0.21.2) or 'latest'"
        type: string
        default: "latest"
permissions:
  pull-requests: write
  contents: write
jobs:
  update-ladybug:
    name: Update Ladybug
    runs-on: macos-15
    env:
      LADYBUG_VERSION: ${{ github.event.inputs.version || 'latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Git
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - name: Update Ladybug
        working-directory: scripts/update-ladybug
        run: python3 update-ladybug.py
      - name: Resolve updated version
        id: version
        run: echo "tag=$(git -C Sources/LadybugCpp describe --tags --exact-match HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          title: "Update Ladybug to ${{ steps.version.outputs.tag }}"
          body: "This PR updates the Ladybug submodule to ${{ steps.version.outputs.tag }} and regenerates Package.swift."
          base: main
          branch: autoupdate/ladybug-${{ steps.version.outputs.tag }}
          labels: autoupdate
          draft: false
          commit-message: "Update Ladybug to ${{ steps.version.outputs.tag }}"
          token: ${{ secrets.DOC_PUSH_TOKEN }}
