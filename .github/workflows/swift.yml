name: Swift Build & Test
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
jobs:
  build-and-test:
    strategy:
      matrix:
        include:
          - runner: macos-15
            config: debug
          - runner: macos-15
            config: release
          - runner: ubuntu-24.04
            config: debug
          - runner: ubuntu-24.04
            config: release
      fail-fast: false
    name: Build and Test on ${{ matrix.runner }} (${{ matrix.config }})
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ccache cmake ninja-build
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install ccache cmake ninja
          fi
      - name: Set up Swift
        if: matrix.runner == 'ubuntu-24.04'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10.1"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.config }}-
            ccache-${{ runner.os }}-
      - name: Configure ccache
        run: |
          echo "CC=ccache clang" >> "$GITHUB_ENV"
          echo "CXX=ccache clang++" >> "$GITHUB_ENV"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --zero-stats
      - name: Prepare ladybug sources
        run: python3 Scripts/collect-ladybug-src/collect-ladybug-src.py
      - name: Build (${{ matrix.config }} mode)
        run: swift build -c ${{ matrix.config }}
      - name: Run tests (${{ matrix.config }} mode)
        run: swift test -c ${{ matrix.config }}
      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

  ios-simulator-test:
    name: Build and Test on iOS Simulator
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - destination: "platform=iOS Simulator,name=iPhone 16,OS=18.6"
            config: debug
          - destination: "platform=iOS Simulator,name=iPhone 16,OS=18.6"
            config: release
      fail-fast: false
    steps:
      - name: Install dependencies
        run: brew install ccache cmake ninja
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-ios-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-ios-${{ matrix.config }}-
            ccache-${{ runner.os }}-
      - name: Configure ccache
        run: |
          echo "CC=ccache clang" >> "$GITHUB_ENV"
          echo "CXX=ccache clang++" >> "$GITHUB_ENV"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --zero-stats
      - name: Prepare ladybug sources
        run: python3 Scripts/collect-ladybug-src/collect-ladybug-src.py
      - name: Build for iOS Simulator
        run: |
          xcodebuild build-for-testing \
            -scheme swift-ladybug \
            -destination "${{ matrix.destination }}" \
            -configuration ${{ matrix.config }} \
            ENABLE_TESTABILITY=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
      - name: Test on iOS Simulator
        run: |
          xcodebuild test-without-building \
            -scheme swift-ladybug \
            -destination "${{ matrix.destination }}" \
            -configuration ${{ matrix.config }} \
            ENABLE_TESTABILITY=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

  example:
    name: Build and Run Example
    runs-on: macos-15
    steps:
      - name: Install dependencies
        run: brew install ccache cmake ninja
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-example-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-example-
            ccache-${{ runner.os }}-
      - name: Configure ccache
        run: |
          echo "CC=ccache clang" >> "$GITHUB_ENV"
          echo "CXX=ccache clang++" >> "$GITHUB_ENV"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache --zero-stats
      - name: Prepare ladybug sources
        run: python3 Scripts/collect-ladybug-src/collect-ladybug-src.py
      - name: Build example project
        working-directory: Example
        run: |
          # Replace remote dependency with local path dependency
          sed 's|.package(url: "https://github.com/LadybugDB/swift-ladybug/", branch: "main")|.package(path: "..")|' Package.swift > Package.swift.tmp
          rm Package.swift
          mv Package.swift.tmp Package.swift
          swift build -c release
          # Copy the built binary to the current directory
          cp ./.build/arm64-apple-macosx/release/swift-ladybug-example .

      - name: Run example
        working-directory: Example
        run: ./swift-ladybug-example
      - name: Show ccache stats
        if: always()
        run: ccache --show-stats
